<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Схема шотов · Локация и персонажи</title>
  <style>
    :root{
      --bg:#171b23;
      --panel:#1f2735;
      --panel2:#27324a;
      --line:#4f6285;
      --text:#eaf0ff;
      --muted:#b7c4dc;
      --accent:#8eb5ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
    .app{max-width:1760px;margin:0 auto;padding:12px}
    .top{
      position:sticky;top:0;z-index:10;border:1px solid var(--line);border-radius:12px;
      background:linear-gradient(180deg,#2a3550,#202a3d);padding:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap
    }
    h1{margin:0;font-size:22px}
    .meta{font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:6px;flex-wrap:wrap}
    .btn{
      border:1px solid var(--line);border-radius:9px;background:#2d3952;color:var(--text);
      text-decoration:none;padding:6px 10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center
    }
    .btn:hover{border-color:var(--accent)}
    .toolbar{
      margin-top:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:8px;
      display:grid;grid-template-columns:200px 280px 1fr auto;gap:8px;align-items:center
    }
    .toolbar input,.toolbar select{
      width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:#1a2334;color:var(--text);padding:4px 8px
    }
    .count{font-size:12px;color:var(--muted);text-align:right}
    .grid{
      margin-top:10px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(510px,1fr))
    }
    .shot{
      border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden
    }
    .shot-head{
      display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--line)
    }
    .shot-id{font-weight:800;font-size:18px}
    .loc-name{font-size:12px;color:#d5e4ff;text-align:right}
    .body{display:grid;grid-template-columns:220px 1fr;gap:10px;padding:10px}
    .loc-card{
      border:1px solid var(--line);border-radius:10px;padding:6px;background:#162032
    }
    .loc-img{width:100%;height:128px;object-fit:cover;border-radius:8px;background:#0d141f}
    .loc-cap{margin-top:5px;font-size:11px;color:var(--muted)}
    .chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;align-content:start}
    .char{
      border:1px solid var(--line);border-radius:9px;padding:6px;background:#172234
    }
    .char-img{width:100%;height:74px;object-fit:cover;border-radius:7px;background:#0c131e}
    .char-name{margin-top:4px;font-size:12px;font-weight:700}
    .unknown{
      border:1px dashed #7286aa;border-radius:8px;padding:10px;color:var(--muted);font-size:12px;text-align:center
    }
    .empty{
      margin-top:10px;border:1px dashed #667aa0;border-radius:10px;padding:18px;text-align:center;color:var(--muted)
    }
    @media (max-width:1200px){
      .toolbar{grid-template-columns:1fr 1fr}
      .count{text-align:left}
    }
    @media (max-width:800px){
      .grid{grid-template-columns:1fr}
      .body{grid-template-columns:1fr}
      .loc-img{height:170px}
    }
  </style>
</head>

      function norm(v){
        return String(v || "")
          .toLowerCase()
          .replace(/[ё]/g, "е")
          .replace(/[()]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function enc(base, file){
        return encodeURI(base + file).replace(/#/g, "%23");
      }

      function findCharacter(raw){
        const n = norm(raw);
        return characterCatalog.find((c) => c.aliases.some((a) => n === norm(a) || n.includes(norm(a)) || norm(a).includes(n)));
      }

      function getLocationByKey(key){
        return locationCatalog.find((l) => l.key === key) || locationCatalog.find((l) => l.key === "unknown");
      }

        const locText = String(shot.locText || "");
        const locNorm = norm(locText);
        const text = norm([shot.locText, shot.title, shot.action, shot.camera].join(" ").replace(/→/g, " "));

        if (text.includes("ворота дворца") || text.includes("двери дворца")) {
          return { key: "palace_gate", reason: "Ключевые слова: ворота/двери дворца" };
        }
        if (text.includes("кабинет") || text.includes("реестр") || text.includes("казначей")) {
          return { key: "palace_office", reason: "Ключевые слова: кабинет/казначей/реестры" };
        }

          return { key: "palace_exit", reason: "Отдельная зона выхода/титров тронного зала" };
        }
        if (text.includes("тронный зал")) {
          return { key: "palace_hall", reason: "Базовая локация: тронный зал" };
        }
        if (text.includes("дворец")) {
          return { key: "palace_exterior", reason: "Ключевое слово: дворец" };
        }

          return { key: "kingdom_wide", reason: "Ключевые слова: страна тортов/сады" };
        }

        }

          return { key: "human_yard", reason: "Ключевые слова: двор частного дома/мир людей" };
        }
        if (text.includes("край горы") || text.includes("край скалы") || text.includes("склон горы") || text.includes("гора")) {
          return { key: "mountain_edge", reason: "Ключевые слова: гора/скала/склон" };
        }
        return { key: "unknown", reason: "Не найдено совпадение, оставлен fallback" };

        shot: s.shot,
        charText: s.charText,
        locText: s.locText,
        title: s.title,
        action: s.action,
        camera: s.camera,
        chars: String(s.charText || "").split(",").map((v) => v.trim()).filter(Boolean)
      }));

      function render(shots){
        const searchShot = norm(document.getElementById("searchShot").value);
        const searchCharacter = norm(document.getElementById("searchCharacter").value);
        const locFilter = document.getElementById("locationFilter").value;
        const root = document.getElementById("shotsGrid");
        const empty = document.getElementById("emptyState");

        const filtered = shots.filter((s) => {
          if (searchShot && !norm(s.shot).includes(searchShot)) return false;
          const locInfo = inferLocation(s);
          const locKey = locInfo.key;
          if (locFilter && locKey !== locFilter) return false;
          if (searchCharacter) {
            const labels = s.chars.map((c) => (findCharacter(c)?.label || c)).join(" ");
            if (!norm(labels).includes(searchCharacter) && !norm(s.charText).includes(searchCharacter)) return false;
          }
          return true;
        });

        document.getElementById("countLabel").textContent = "Показано шотов: " + filtered.length + " / " + shots.length;

        if (!filtered.length){
          root.innerHTML = "";
          empty.style.display = "";
          return;
        }
        empty.style.display = "none";

        root.innerHTML = filtered.map((s) => {
          const inferred = inferLocation(s);
          const loc = getLocationByKey(inferred.key);
          const locLabel = loc ? loc.label : s.locText;
          const locImg = loc ? "<img class='loc-img' loading='lazy' src='" + enc(locBase, loc.image) + "' alt='" + locLabel + "'>" : "<div class='unknown'>Локация не найдена</div>";

          const chars = s.chars.map((raw) => {
            const c = findCharacter(raw);
            const label = c ? c.label : raw;
            const img = c
              ? "<img class='char-img' loading='lazy' src='" + enc(charsBase, c.image) + "' alt='" + label + "'>"
              : "<div class='unknown'>нет фото</div>";
            return (
              "<div class='char'>" +
                img +
                "<div class='char-name'>" + label + "</div>" +
              "</div>"
            );
          }).join("");

          return (
            "<article class='shot'>" +
              "<div class='shot-head'>" +
                "<div class='shot-id'>" + s.shot + "</div>" +
                "<div class='loc-name'>" + locLabel + "<br><span style='font-size:11px;color:#b9c9e6'>Исходно: " + s.locText + "</span></div>" +
              "</div>" +
              "<div class='body'>" +
                "<div class='loc-card'>" +
                  locImg +
                  "<div class='loc-cap'>" + (loc ? ("Подлокация по анализу: " + inferred.reason) : ("Исходная подпись: " + s.locText)) + "</div>" +
                "</div>" +
                "<div class='chars'>" + (chars || "<div class='unknown'>Персонажи не указаны</div>") + "</div>" +
              "</div>" +
            "</article>"
          );
        }).join("");
      }

      function fillLocationFilter(shots){
        const sel = document.getElementById("locationFilter");
        const keys = new Map();
        shots.forEach((s) => {
          const loc = getLocationByKey(inferLocation(s).key);
          if (!loc) return;
          keys.set(loc.key, loc.label);
        });
        Array.from(keys.entries()).sort((a,b) => a[1].localeCompare(b[1], "ru")).forEach(([k,v]) => {
          const opt = document.createElement("option");
          opt.value = k;
          opt.textContent = v;
          sel.appendChild(opt);
        });
      }

      if (shotData.length !== 68) {
        document.getElementById("shotsGrid").innerHTML = "<div class='empty'>Ошибка политики: требуется 68 шотов, обнаружено " + shotData.length + ".</div>";
      }

      fillLocationFilter(shotData);
      render(shotData);
      document.getElementById("searchShot").addEventListener("input", () => render(shotData));
      document.getElementById("searchCharacter").addEventListener("input", () => render(shotData));
      document.getElementById("locationFilter").addEventListener("change", () => render(shotData));
    })();
  </script>
